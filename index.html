<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>12306 中转换乘查询</title>
    <style>
      :root { --bd: #dcdfe6; --pri: #2b6cb0; --muted: #718096; --warn: #c05621; --danger: #c53030; }
      * { box-sizing: border-box; }
      body { margin: 0; font: 14px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; color: #1a202c; }
      header { padding: 16px 20px; border-bottom: 1px solid var(--bd); }
      h1 { margin: 0; font-size: 18px; }
      h1 small { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: 8px; }
      form { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; padding: 16px 20px; border-bottom: 1px solid var(--bd); }
      label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
      input, select, button { padding: 7px 10px; border: 1px solid var(--bd); border-radius: 6px; font: inherit; }
      input { width: 130px; }
      input[type="date"] { width: 160px; }
      button { cursor: pointer; background: var(--pri); color: #fff; border-color: var(--pri); }
      button:disabled { opacity: .5; cursor: not-allowed; }
      main { padding: 16px 20px; }
      .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--bd); margin-bottom: 12px; }
      .tabs button { background: none; color: var(--muted); border: none; border-bottom: 2px solid transparent; border-radius: 0; padding: 8px 14px; }
      .tabs button[aria-selected="true"] { color: var(--pri); border-bottom-color: var(--pri); }
      .status { color: var(--muted); font-size: 12px; margin: 8px 0; min-height: 1.4em; }
      .err { color: var(--danger); }
      .warn { color: var(--warn); }
      .card { border: 1px solid var(--bd); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
      .card .head { display: flex; justify-content: space-between; gap: 12px; }
      .card .train { font-weight: 600; }
      .card .time { color: var(--muted); }
      .card .seats { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; }
      .tag { border: 1px solid var(--bd); border-radius: 4px; padding: 1px 6px; font-size: 11px; color: var(--muted); }
      .tag.on { color: #2f855a; border-color: #9ae6b4; }
      .tag.off { color: #a0aec0; }
      .flag { font-size: 11px; padding: 1px 6px; border-radius: 4px; }
      .flag.risky { background: #feebc8; color: var(--warn); }
      .flag.long { background: #e2e8f0; color: var(--muted); }
      .flag.bad { background: #fed7d7; color: var(--danger); }
      .hub-group { margin-bottom: 10px; }
      .hub-group > summary { cursor: pointer; font-weight: 600; }
      .empty { color: var(--muted); padding: 20px 0; }
      .group { display: none; }
      .group.active { display: block; }
    </style>
  </head>
  <body>
    <header>
      <h1>12306 中转换乘查询 <small>比官方网页给出更多中转方案</small></h1>
    </header>

    <form id="form">
      <label>出发城市<input id="from" list="cities" placeholder="北京" required /></label>
      <label>到达城市<input id="to" list="cities" placeholder="上海" required /></label>
      <label>日期<input id="date" type="date" required /></label>
      <label>席别
        <select id="seat">
          <option value="ZE">二等座</option>
          <option value="ZY">一等座</option>
          <option value="SWZ">商务座</option>
          <option value="WZ">无座</option>
        </select>
      </label>
      <label>出发时段
        <select id="period">
          <option value="">全部</option>
          <option value="morning">上午 06-12</option>
          <option value="afternoon">下午 12-18</option>
          <option value="evening">晚上 18-24</option>
        </select>
      </label>
      <label>口令<input id="token" placeholder="可选" autocomplete="off" /></label>
      <button id="submit" type="submit">查询</button>
    </form>
    <datalist id="cities"></datalist>

    <main>
      <div class="status" id="status"></div>
      <div class="tabs" role="tablist">
        <button role="tab" aria-selected="true" data-tab="direct">直达</button>
        <button role="tab" aria-selected="false" data-tab="transfer">中转</button>
      </div>
      <section class="group active" id="panel-direct"><div class="empty">输入城市与日期后查询</div></section>
      <section class="group" id="panel-transfer"><div class="empty">—</div></section>
    </main>

    <script type="module" src="./web/main.js"></script>
  </body>
</html>
